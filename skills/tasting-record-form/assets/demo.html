<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<title>TastingForm demo</title>
<style>
body{font-family:sans-serif;background:#EFE6D8;padding:30px;}
.card{background:#fff;border-radius:10px;padding:20px;max-width:480px;box-shadow:0 4px 14px rgba(0,0,0,.08);}
.field{margin-bottom:10px;}
.field label{display:block;font-size:11px;font-weight:600;color:#5A4636;margin-bottom:3px;text-transform:uppercase;}
.field input,.field select{width:100%;border:1px solid #B9A886;border-radius:6px;padding:7px 9px;font-size:13px;box-sizing:border-box;}
.slider-field{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:8px;margin-bottom:6px;}
#radarOut{margin-top:16px;}
</style>
</head>
<body>
<div class="card">
  <h3>品飲紀錄表單（設定檔驅動）</h3>
  <div id="formMount"></div>
  <div id="radarOut"></div>
</div>

<script src="../../radar-chart/assets/radar-chart.js"></script>
<script src="tasting-record-form.js"></script>
<script>
fetch('tasting-form-fields.json').then(r=>r.json()).then(config=>{
  const entry = TastingForm.emptyEntry(config);
  const mount = document.getElementById('formMount');
  mount.innerHTML = TastingForm.fieldsHTML(config, entry);

  const axes = TastingForm.deriveRadarAxes(config);
  function redrawRadar(){
    const vals = TastingForm.readRadarValues(config, mount);
    document.getElementById('radarOut').innerHTML = RadarChart.render(axes, vals, {size:200});
  }
  redrawRadar();
  mount.addEventListener('input', function(e){
    const out = mount.querySelector(`[data-out="${e.target.getAttribute('data-field')}"]`);
    if(out) out.textContent = e.target.value + '/' + e.target.max;
    redrawRadar();
  });
});
</script>
</body>
</html>
